<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFinder | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
</head>
<body>
  <main class="login">
    <h1 class="sr-only">PetFinder - Coleira inteligente</h1>
    <img class="logo" src="PetFinder-Logo.png" alt="PetFinder - Coleira inteligente"
         onerror="this.style.display='none'">

    <form id="form-login" novalidate>
      <input class="campo" type="email" id="email" name="email"
             placeholder="E-mail" autocomplete="email" aria-label="E-mail" required>
      <input class="campo" type="password" id="senha" name="senha"
             placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
      <p class="erro" id="erro" role="alert"></p>
      <button class="botao" type="submit">Login</button>
    </form>

    <a class="cadastro" href="cadastro.html">Novo cadastro</a>
  </main>

  <script>
    const form = document.getElementById("form-login");
    const erro = document.getElementById("erro");

    form.addEventListener("submit", (e) )
 {
      e.preventDefault();
      const email = form.email.value.trim();
      const senha = form.senha.value;

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        erro.textContent = "Digite um e-mail válido.";
        form.email.focus();
        return;
      }
      if (senha.length < 8) {
        erro.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        form.senha.focus();
        return;
      }

      erro.textContent = "";
      console.log("Login enviado para:", email);
    }
  </script>
</body>
</html>
