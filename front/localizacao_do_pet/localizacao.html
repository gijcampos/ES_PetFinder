<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Localização em tempo real | PetFinder (prévia)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="#" aria-label="PetFinder - Coleira inteligente">
    <!-- Troque este SVG pela sua logo: <img class="logo" src="..." alt="PetFinder"> -->
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#033960"/><path d="M32 1a31 31 0 0 1 0 62z" fill="#d08a86"/><ellipse cx="32" cy="40" rx="11" ry="9" fill="#fff"/><circle cx="18" cy="30" r="4.5" fill="#fff"/><circle cx="27" cy="22" r="4.5" fill="#fff"/><circle cx="37" cy="22" r="4.5" fill="#fff"/><circle cx="46" cy="30" r="4.5" fill="#fff"/></svg>
    <span><b>PETFINDER</b><small>COLEIRA INTELIGENTE</small></span>
  </a>
</header>

<main>
  <section class="cartao" aria-label="Localização em tempo real">
    <div class="mapa-wrap">
      <div id="mapa" role="img" aria-label="Mapa ilustrativo com a posição atual do pet e o raio de segurança"></div>
      <p class="mapa-msg" id="mapa-msg" hidden></p>
    </div>

    <div class="painel-wrap">
      <aside class="painel">
        <h1>Meus pets</h1>
        <ul class="pets" id="pets" aria-live="polite"></ul>
        <hr>
        <section class="detalhe" id="detalhe"></section>
        <p class="aviso" id="aviso" role="status" hidden>Sem conexão. Tentando atualizar novamente...</p>
        <a class="btn-hist" id="hist" href="historico.html" hidden>Ver histórico de hoje</a>
      </aside>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
