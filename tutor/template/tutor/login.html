{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFinder | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Carregamento do CSS estático -->
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
  <main class="login">
    <h1 class="sr-only">PetFinder - Coleira inteligente</h1>
    
    <!-- Imagem carregada via tag estática -->
    <img class="logo" src="{% static 'img/PetFinder-Logo.png' %}" alt="PetFinder - Coleira inteligente"
         onerror="this.style.display='none'">

    <!-- Adicionado method="POST" para funcionamento correto no Django -->
    <form id="form-login" method="POST" novalidate>
      <!-- Token de segurança obrigatório no Django para formulários POST -->
      {% csrf_token %}
      
      <input class="campo" type="email" id="email" name="email"
             placeholder="E-mail" autocomplete="email" aria-label="E-mail" required>
      <input class="campo" type="password" id="senha" name="senha"
             placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
      <p class="erro" id="erro" role="alert"></p>
      <button class="botao" type="submit">Login</button>
    </form>

    <!-- Redirecionamento utilizando o nome da rota definida no urls.py -->
    <a class="cadastro" href="{% url 'cadastro' %}">Novo cadastro</a>
  </main>

  <!-- Carregamento do JavaScript estático -->
  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
